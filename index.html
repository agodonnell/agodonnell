<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aaron O'Donnell — Digital Asset Strategist</title>
  <meta name="description" content="Digital Asset Strategist focusing on cross‑border settlement, smart‑contract payments, and stablecoin rails. Senior Data Engineer foundation; multilingual focus." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b0d10; --card:#12161b; --muted:#a9b3c0; --text:#e9eef5; --accent:#60a5fa; --accent2:#34d399;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .wrap{max-width:1024px;margin:0 auto;padding:28px 20px 64px}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
    .brand{font-weight:700;letter-spacing:.2px}
    .nav{display:flex;gap:14px;align-items:center}
    .lang button{background:transparent;border:1px solid #223; color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer}
    .lang button.active{border-color:var(--accent);color:var(--text)}
    .hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center;margin:28px 0 18px}
    .card{background:var(--card);border:1px solid #1c222a;border-radius:16px;padding:20px}
    .badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:#0f1318;border:1px solid #1c222a;border-radius:999px;padding:6px 10px;margin-bottom:12px}
    h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:8px 0 10px}
    p.lead{font-size:clamp(16px,2.4vw,18px);color:var(--muted);margin:0 0 8px}
    .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#071018;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
    .btn.secondary{background:transparent;border:1px solid #263040;color:var(--text)}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:18px}
    .col-6{grid-column:span 6}
    .col-12{grid-column:span 12}
    @media(max-width:860px){.hero{grid-template-columns:1fr}.col-6{grid-column:span 12}}
    h2{font-size:22px;margin:8px 0 10px}
    ul{margin:8px 0 0 18px;color:var(--muted)}
    .footer{margin-top:48px;color:#7b8794;font-size:13px;display:flex;flex-wrap:wrap;gap:8px}
    .logos{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
    .logo{font-size:12px;border:1px dashed #243; color:#8fa3b8; padding:6px 8px;border-radius:8px}
    .small{font-size:13px;color:var(--muted)}
    .hr{height:1px;background:#1b2027;margin:24px 0}
    /* terms list */
    .terms dt{font-weight:600;margin-top:10px}
    .terms dd{color:var(--muted);margin:4px 0 10px 0}
  </style>
</head>

    <section id="about" class="grid">

    <section id="terms" class="grid">

        </p>
      </div>
    </section>

    <footer class="footer">
      <span>&copy; <span id="year"></span> Aaron O'Donnell</span>

    </footer>
  </div>

    function setLang(lang){
      document.querySelectorAll("[data-i18n]").forEach(el=>{
        const key = el.getAttribute("data-i18n");
        el.textContent = copy[lang][key] || "";
      });
      localStorage.setItem("site_lang", lang);
      document.querySelectorAll('.lang button').forEach(b=>b.classList.remove('active'));
      document.getElementById('lang-'+lang).classList.add('active');
      document.documentElement.lang = lang;
    }
    document.getElementById('lang-en').onclick = ()=>setLang('en');
    document.getElementById('lang-es').onclick = ()=>setLang('es');
    setLang(localStorage.getItem('site_lang') || 'en');

    document.getElementById('year').textContent = new Date().getFullYear();
